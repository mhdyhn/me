# Render Blueprint: one web service that serves the built app (dist/) and the API (/api).
# Render asks for the values marked sync: false when you create the service from this file.
#
# NODE_ENV=production makes `npm ci` skip devDependencies (TypeScript, Vite, @types/node).
# The build needs them, so the build command forces them with --include=dev.
#
# This uses the FREE plan (no card needed). The data is stored in a hosted PostgreSQL database
# (Neon, free), not in the service, so accounts and coach data survive restarts, redeploys and
# idle spin-down. Set DATABASE_URL in the Render dashboard (Environment) to the Neon connection string.
services:
  - type: web
    name: meety
    runtime: node
    plan: free
    region: frankfurt
    branch: arena/b53a1e35-me
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MEETY_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

# Render Blueprint: one web service that serves the built app (dist/) and the API (/api).
# Render asks for the values marked sync: false when you create the service from this file.
#
# The SQLite database lives on a persistent disk. Disks need a paid instance type (starter).
# Without a disk, accounts and data are lost on every restart or redeploy.
services:
  - type: web
    name: meety
    runtime: node
    plan: starter
    region: frankfurt
    branch: arena/b53a1e35-me
    buildCommand: npm ci && npm run build
    startCommand: node server/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/meety.sqlite
      - key: MEETY_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: meety-data
      mountPath: /var/data
      sizeGB: 1

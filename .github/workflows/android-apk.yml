name: Build Android APK

# Builds a debug APK of the Capacitor app and stores it as a downloadable artifact.
# Start it from the Actions tab, or push a tag that starts with "v".
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web app and copy it into the Android project
        env:
          VITE_API_BASE: https://meety-985n.onrender.com
        run: |
          npm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android platform 36 and build tools
        # ubuntu-latest already ships the Android SDK in $ANDROID_HOME; only add what the project needs.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager: ${SDKMANAGER:-not found}"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Prepare release signing keystore
        working-directory: android/app
        run: |
          if [ ! -f meety-release.keystore ]; then
            echo "Generating release signing keystore..."
            keytool -genkeypair -v \
              -keystore meety-release.keystore \
              -alias meety \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass meety123456 \
              -keypass meety123456 \
              -dname "CN=Meety App, OU=Engineering, O=Meety, L=Tehran, ST=Tehran, C=IR"
          fi

      - name: Build the signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: meety-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp "$APK_FILE" /tmp/meety.apk
          gh release upload v1.0.0-app /tmp/meety.apk --clobber || \
          gh release create v1.0.0-app /tmp/meety.apk \
            --title "اپلیکیشن اندروید میتی (APK)" \
            --notes "دانلود مستقیم فایل نصبی رسمی اندروید میتی (APK) نسخه ۱.۰" \
            --target main \
            --clobber || true

      - name: Commit APK to repo for direct serving
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          mkdir -p public
          cp "$APK_FILE" public/meety.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/meety.apk
          if git diff --staged --quiet; then
            echo "No change in APK binary"
          else
            git commit -m "chore: embed latest Android release APK binary [skip ci]"
            git push origin HEAD:main
          fi

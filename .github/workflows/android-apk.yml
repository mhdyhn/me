name: Build Android APK

# A release uses a persistent signing key stored in GitHub Actions secrets.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web app and copy it into the Android project
        env:
          VITE_API_BASE: ${{ vars.ANDROID_API_BASE }}
        run: |
          node -e 'const value = process.env.VITE_API_BASE; if (!value) { console.error("::error title=Android API configuration::Repository variable ANDROID_API_BASE is missing or unavailable."); process.exit(1); } try { const u = new URL(value); if (u.protocol !== "https:" || u.username || u.password || u.pathname !== "/" || u.search || u.hash) throw 0; } catch { console.error("::error title=Android API configuration::ANDROID_API_BASE must be a public HTTPS origin without a path."); process.exit(1); }'
          npm run build || { echo "::error title=Android web build::The web build failed before Capacitor synchronization."; exit 1; }
          npx cap sync android || { echo "::error title=Android synchronization::Capacitor could not copy the web assets."; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android platform 36 and build tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare release signing keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ENCODED_KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Android signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/meety-release.keystore"
          test -s "$RUNNER_TEMP/meety-release.keystore"

      - name: Build and verify the signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/meety-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: meety-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish a tagged APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/meety.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/meety.apk" --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/meety.apk" --verify-tag --title "میتی $RELEASE_TAG" --notes "نسخهٔ امضاشدهٔ اندروید میتی"
          fi

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/meety-release.keystore"

name: Build Android APK

# A release uses a persistent signing key stored in GitHub Actions secrets.
on:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Optional release tag (for example v1.0.1). The signed APK is published to this GitHub release.'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure the Android API and expected signer
        env:
          ANDROID_API_BASE: ${{ vars.ANDROID_API_BASE }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: node tools/android-release-config.mjs

      - name: Check release signing secrets
        id: signing_secrets
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Android release signing::Missing or unavailable signing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error title=Android release signing::Create the keystore with 'node tools/create-android-keystore.mjs' and store the four values in the repository secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). See README, section 'Building a signed Android APK'."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build the web app and copy it into the Android project
        run: |
          npm run build || { echo "::error title=Android web build::The web build failed before Capacitor synchronization."; exit 1; }
          node tools/prepare-android-assets.mjs clean || { echo "::error title=Android assets::The gzip sidecars could not be removed."; exit 1; }
          npx cap sync android || { echo "::error title=Android synchronization::Capacitor could not copy the web assets."; exit 1; }
          node tools/prepare-android-assets.mjs verify || { echo "::error title=Android assets::Gzip sidecars must not be packaged for Android."; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android platform 36 and build tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      # Diagnose compilation without publishing a debug APK if release secrets are unavailable.
      - name: Compile debug APK for diagnostics only
        if: steps.signing_secrets.outcome == 'failure'
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/meety-gradle-debug.log" || {
            echo "::error title=Android debug compile::The debug compile failed. No release APK was created or published."
            message="$(tail -40 "$RUNNER_TEMP/meety-gradle-debug.log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{ if (NR>1) printf "%%0A"; printf "%s", $0 }')"
            echo "::error title=Android debug compile::$message"
            exit 1
          }

      - name: Stop when release signing is unavailable
        if: steps.signing_secrets.outcome == 'failure'
        run: |
          echo "::error title=Android release signing::The debug compile is diagnostic only; no release APK was created or published."
          exit 1

      - name: Prepare release signing keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ENCODED_KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Android signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/meety-release.keystore"
          test -s "$RUNNER_TEMP/meety-release.keystore"
          keytool -exportcert -keystore "$RUNNER_TEMP/meety-release.keystore" -alias "$KEY_ALIAS" \
            -storepass:env KEYSTORE_PASSWORD -file "$RUNNER_TEMP/meety-signing-cert.der" > /dev/null
          actual="$(sha256sum "$RUNNER_TEMP/meety-signing-cert.der" | cut -d ' ' -f 1)"
          if [ -n "$ANDROID_EXPECTED_CERT_SHA256" ]; then
            if [ "$actual" != "$ANDROID_EXPECTED_CERT_SHA256" ]; then
              echo "::error title=Android release signing::The keystore certificate does not match the pinned signing certificate; release blocked."
              exit 1
            fi
          else
            echo "::notice title=Android release signing::The release is signed with the stored keystore. Certificate SHA-256: $actual"
            if [ -n "$ANDROID_PREVIOUS_CERT_SHA256" ] && [ "$actual" != "$ANDROID_PREVIOUS_CERT_SHA256" ]; then
              echo "::warning title=Android upgrade compatibility::This key differs from the last published APK. Installed apps cannot be updated with it and must be installed again."
            fi
          fi

      - name: Build and verify the signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/meety-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/meety-apk-signature.txt"
          node ../tools/verify-android-signer.mjs "$RUNNER_TEMP/meety-apk-signature.txt"

      - name: Upload the APK as an artifact
        uses: actions/upload-artifact@v6
        with:
          name: meety-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish a tagged APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.publish_tag }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/meety.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/meety.apk" --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/meety.apk" --target "${{ github.sha }}" --title "میتی $RELEASE_TAG" --notes "نسخهٔ امضاشدهٔ اندروید میتی"
          fi

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/meety-release.keystore" "$RUNNER_TEMP/meety-signing-cert.der" "$RUNNER_TEMP/meety-apk-signature.txt" "$RUNNER_TEMP/meety-gradle-debug.log"

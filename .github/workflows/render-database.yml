name: Point the Render service at a database

# Puts a new database connection string into the Render service and starts a deploy.
# Useful when the hosted database changes: no need to open the Render dashboard by hand.
#
# Repository secrets are needed (Settings → Secrets and variables → Actions):
#   RENDER_API_KEY   an API key from render.com → Account Settings → API Keys
#   DATABASE_URL     the connection string of the new database, for example
#                    postgresql://user:password@host:5432/postgres
#   ADMIN_USERNAME   optional; the admin account of the application
#   ADMIN_PASSWORD   optional; the password of the admin account
#
# The string is checked against the server first, and the spelling that really works is the one
# that is written to the service. A password with a special character (`@`, `#`, `%`) otherwise
# changes the meaning of the string, and the server then refuses the login with 28P01.
# The password never appears in the workflow file or in the logs.

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'The name of the Render service'
        required: false
        default: meety

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Set the connection string and deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SERVICE_NAME: ${{ inputs.service }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${DATABASE_URL:-}" ]; then
            echo "RENDER_API_KEY or DATABASE_URL is missing in the repository secrets."
            exit 1
          fi

          service_id=$(curl -fsS "https://api.render.com/v1/services?limit=100" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const list=JSON.parse(d);const hit=list.find(x=>x.service&&x.service.name===process.env.SERVICE_NAME);if(!hit){console.error('Service not found: '+process.env.SERVICE_NAME);process.exit(1)}console.log(hit.service.id)})")
          echo "Service ${SERVICE_NAME} = ${service_id}"
          export SERVICE_ID="${service_id}"

          # The checker tries the spellings of the password and prints the one that works.
          # The string is captured, never printed, so it stays out of the log.
          export DATABASE_URL
          WORKING_URL=$(node tools/check-database.mjs --quiet)
          echo "The connection string works."

          # Writes one environment variable of the service; the value never reaches the log.
          apply_env_var() {
            KEY="$1" VALUE="$2" node -e '
              (async () => {
                const key = process.env.KEY;
                const value = process.env.VALUE;
                const base = `https://api.render.com/v1/services/${process.env.SERVICE_ID}/env-vars`;
                const headers = { Authorization: `Bearer ${process.env.RENDER_API_KEY}`, "Content-Type": "application/json" };
                const listed = await (await fetch(`${base}?limit=100`, { headers })).json();
                const exists = listed.some((item) => item.envVar && item.envVar.key === key);
                const response = await fetch(exists ? `${base}/${key}` : base, {
                  method: exists ? "PUT" : "POST",
                  headers,
                  body: JSON.stringify(exists ? { value } : [{ key, value }]),
                });
                if (!response.ok) {
                  console.error(`Could not set ${key}: ${response.status}`);
                  process.exit(1);
                }
                console.log(`${key} ${exists ? "updated" : "added"}.`);
              })();
            '
          }

          # The admin account is created on the first start. A fresh database needs it.
          if [ -n "${ADMIN_USERNAME:-}" ] && [ -n "${ADMIN_PASSWORD:-}" ]; then
            apply_env_var ADMIN_USERNAME "${ADMIN_USERNAME}"
            apply_env_var ADMIN_PASSWORD "${ADMIN_PASSWORD}"
          else
            echo "ADMIN_USERNAME or ADMIN_PASSWORD is missing; the admin account is not created."
          fi

          apply_env_var DATABASE_URL "${WORKING_URL}"
          # The free host wakes up slowly; give the first connection more time.
          apply_env_var DATABASE_CONNECT_TIMEOUT_MS "30000"

          # Only the names of the environment variables are printed, never their values.
          curl -fsS "https://api.render.com/v1/services/${service_id}/env-vars?limit=100" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const list=JSON.parse(d);const keys=list.map(x=>x.envVar&&x.envVar.key).filter(Boolean);console.log('Environment keys: '+keys.join(', '))})"

          curl -fsS -X POST "https://api.render.com/v1/services/${service_id}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' > /dev/null

          echo "The deploy started. Check https://meety-985n.onrender.com/api/health?probe=1 in a few minutes."

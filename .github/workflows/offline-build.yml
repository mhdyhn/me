name: Build offline single file

# Builds the one-file offline version of Meety and stores it as a downloadable
# artifact of the run. Start it by hand from the Actions tab (Run workflow),
# or by pushing a tag that starts with "v".
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Build the offline single file
        run: npm run build:offline

      - name: Check the offline file
        run: npm run verify:offline

      - name: Upload the offline file as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: meety-offline
          path: dist/meety-offline.html
          if-no-files-found: error
          retention-days: 30

name: Copy the data of the old database

# Copies the accounts, the programmes and the transactions of an old database into the current
# one. Use it when the hosted database changed and the old accounts have to come along.
#
# Repository secrets are needed (Settings → Secrets and variables → Actions):
#   SOURCE_DATABASE_URL  the connection string of the OLD database, for example the Neon one.
#                        When it is missing, the secret DATABASE_URL is used, which holds the
#                        connection string of the old database as long as it was not replaced.
#   TARGET_DATABASE_URL  the connection string of the CURRENT database. When it is missing, the
#                        value of DATABASE_URL in the Render service is read with RENDER_API_KEY.
#   RENDER_API_KEY       an API key from render.com → Account Settings → API Keys; only needed
#                        when the target is not given
#
# Nothing is deleted: only the rows that are missing are inserted, so a second run is safe.
# The log holds the number of rows per table, never a password.
#
# The old database has to answer on IPv4: the runner of GitHub has no IPv6 route.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only count the rows, write nothing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Copy the rows
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          OLD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET_DATABASE_URL: ${{ secrets.TARGET_DATABASE_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_NAME: meety
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail

          fail() {
            echo "::error title=Cannot copy the data::$1"
            exit 1
          }

          # The kind of a host, without the name of the project: neon.tech or supabase.com.
          kind_of() {
            case "$1" in
              *neon.tech*) echo "neon.tech" ;;
              *supabase.com*) echo "supabase.com" ;;
              *) echo "another host" ;;
            esac
          }

          # The old database: the secret of its own, or the one that held it before.
          if [ -n "${SOURCE_DATABASE_URL:-}" ]; then
            source_url="$SOURCE_DATABASE_URL"
            echo "The source is the secret SOURCE_DATABASE_URL."
          elif [ -n "${OLD_DATABASE_URL:-}" ]; then
            source_url="$OLD_DATABASE_URL"
            echo "The source is the secret DATABASE_URL."
          else
            fail "SOURCE_DATABASE_URL is missing in the repository secrets."
          fi

          target="${TARGET_DATABASE_URL:-}"
          if [ -z "$target" ] && [ -n "${RENDER_API_KEY:-}" ]; then
            # The current connection string of the service is the target.
            service_id=$(curl -fsS "https://api.render.com/v1/services?limit=100" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const list=JSON.parse(d);const hit=list.find(x=>x.service&&x.service.name===process.env.SERVICE_NAME);if(!hit){console.error('Service not found: '+process.env.SERVICE_NAME);process.exit(1)}console.log(hit.service.id)})") || fail "The Render service could not be read; the RENDER_API_KEY is probably not valid."
            target=$(curl -fsS "https://api.render.com/v1/services/${service_id}/env-vars?limit=100" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const list=JSON.parse(d);const hit=list.find(x=>x.envVar&&x.envVar.key==='DATABASE_URL');if(!hit)process.exit(1);process.stdout.write(hit.envVar.value)})") || fail "The Render service was read, but it has no DATABASE_URL."
          fi
          if [ -z "$target" ]; then
            fail "TARGET_DATABASE_URL is missing and the Render service could not be read. Add the secret TARGET_DATABASE_URL with the connection string of the current database."
          fi

          echo "The source is a database on $(kind_of "$source_url") and the target is a database on $(kind_of "$target")."
          export SOURCE_DATABASE_URL="$source_url"
          export TARGET_DATABASE_URL="$target"

          if [ "$DRY_RUN" = "true" ]; then
            output=$(node tools/migrate-database.mjs --dry-run 2>&1)
            status=$?
          else
            output=$(node tools/migrate-database.mjs 2>&1)
            status=$?
          fi
          echo "$output"
          if [ "$status" -ne 0 ]; then
            last_line=$(printf '%s\n' "$output" | grep -v '^\s*$' | tail -n 1)
            fail "The copy failed: ${last_line}"
          fi

      - name: Show the health of the service
        run: curl -fsS "https://meety-985n.onrender.com/api/health?probe=1" || true

name: Live deployment check

# Temporary helper: polls the live Render deployment and stores the answer as an artifact,
# because the workspace cannot reach the hosted service directly.
on:
  push:
    branches:
      - arena/160d7123-me
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Poll the live deployment
        run: |
          rm -f /tmp/live.txt
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/live.txt -w '%{http_code}' "https://meety-985n.onrender.com/api/release?check=gh-$i")
            echo "attempt $i http=$code"
            head -c 400 /tmp/live.txt
            echo
            if [ "$code" = "200" ]; then break; fi
            sleep 20
          done
          echo "health: $(curl -s -o /tmp/health.txt -w '%{http_code}' 'https://meety-985n.onrender.com/api/health')"
          cat /tmp/health.txt || true
          echo >> /tmp/live.txt
          cat /tmp/health.txt >> /tmp/live.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: live-deployment-check
          path: /tmp/live.txt

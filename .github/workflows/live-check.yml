name: Live deployment check

# Temporary helper: polls the live Render deployment and stores the answer as an artifact,
# because the workspace cannot reach the hosted service directly.
on:
  push:
    branches:
      - arena/57fad14c-me
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Poll the live deployment
        run: |
          {
            echo "=== dns ==="
            getent hosts meety-985n.onrender.com || true
            for i in $(seq 1 10); do
              echo "=== attempt $i ($(date -u +%H:%M:%S)) ==="
              curl -sS --max-time 30 -D /tmp/head.txt -o /tmp/live.txt -w 'http=%{http_code} connect=%{time_connect} start=%{time_starttransfer} total=%{time_total}\n' \
                "https://meety-985n.onrender.com/api/release?check=gh-$i" || echo "curl exit=$?"
              echo "--- headers ---"
              cat /tmp/head.txt 2>/dev/null | head -20
              echo "--- body (first 600 bytes) ---"
              head -c 600 /tmp/live.txt 2>/dev/null
              echo
              if grep -q '"revision"' /tmp/live.txt 2>/dev/null; then break; fi
              sleep 20
            done
          } >> /tmp/live.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-deployment-check
          path: /tmp/live.txt

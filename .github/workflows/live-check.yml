name: Live deployment check

# Temporary helper: polls the live Render deployment and reports the answer as an annotation,
# because the workspace cannot reach the hosted service directly.
on:
  push:
    branches:
      - arena/57fad14c-me
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Poll the live deployment
        run: |
          set +e
          out="$GITHUB_WORKSPACE/live-check.txt"
          : > "$out"
          {
            for i in $(seq 1 24); do
              echo "=== attempt $i ($(date -u +%H:%M:%S)) ==="
              curl -sS --max-time 25 -o body.txt -w 'release http=%{http_code} total=%{time_total}\n' \
                "https://meety-985n.onrender.com/api/release?check=gh-$i"
              head -c 300 body.txt
              echo
              curl -sS --max-time 25 -o health.txt -w 'health http=%{http_code} total=%{time_total}\n' \
                "https://meety-985n.onrender.com/api/health?check=gh-$i"
              head -c 300 health.txt
              echo
              sleep 20
            done
          } >> "$out" 2>&1
          echo "::error title=Live deployment::$(tail -c 900 "$out" | tr '\n' ' ')"

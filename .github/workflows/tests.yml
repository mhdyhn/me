name: Tests

# Runs the whole suite on every push and every pull request. A real PostgreSQL is started
# for it, so the copy between two databases is checked the same way the migration
# workflow runs it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suites that need a PostgreSQL to work in: the copy between two databases and
      # the suites of the server that build a schema of their own.
      TEST_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Run the tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Show the result in the summary of the run
        if: always()
        run: |
          {
            echo '### The result of the tests'
            echo
            echo '```'
            tail -n 120 test-output.txt || echo 'The tests did not write anything.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^ (FAIL|✓|×)|Tests  |Test Files ' test-output.txt | head -n 40 | while read -r line; do
            echo "::error title=Tests::$line"
          done || true
